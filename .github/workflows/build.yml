name: Simulator build
on: [push, pull_request]
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build iOS Simulator
        run: xcodebuild build -project FurnacePath.xcodeproj -scheme FurnacePath -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Capture isolated simulator verification
        run: bash scripts/ci/screenshots.sh
      - name: Exercise demo sign-out
        run: |
          device=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; print(next(x["udid"] for g in json.load(sys.stdin)["devices"].values() for x in g))')
          xcodebuild test -project FurnacePath.xcodeproj -scheme FurnacePath -destination "id=$device" -resultBundlePath "$RUNNER_TEMP/auth-flow.xcresult" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-flow-result
          path: ${{ runner.temp }}/auth-flow.xcresult
      - uses: actions/upload-artifact@v4
        with:
          name: verify-m11d
          path: verify-m11d/*.png

      - uses: actions/upload-artifact@v4
        with:
          name: verify-m13
          path: verify-m13/*.png

      - uses: actions/upload-artifact@v4
        with:
          name: verify-m13b
          path: verify-m13b/*.png

      - uses: actions/upload-artifact@v4
        with:
          name: verify-learn
          path: verify-learn/*.png
