name: TestFlight delivery
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: testflight-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyJWT cryptography requests
      - name: Prepare private API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_dir="$RUNNER_TEMP/asc-private"
          mkdir -p "$key_dir"
          export API_PRIVATE_KEYS_DIR="$key_dir"
          export ASC_KEY_PATH="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          python3 - <<'PY'
          import base64, os
          try:
              raw = base64.b64decode(os.environ['ASC_KEY_P8_BASE64'], validate=True)
              with open(os.environ['ASC_KEY_PATH'], 'wb') as key:
                  key.write(raw)
          except Exception:
              raise SystemExit('Cannot decode App Store Connect key; verify the secret format.') from None
          PY
          unset ASC_KEY_P8_BASE64
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"
          echo "API_PRIVATE_KEYS_DIR=$API_PRIVATE_KEYS_DIR" >> "$GITHUB_ENV"
      - name: Install distribution identity and profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          DISTRIBUTION_CERTIFICATE_ID: ${{ secrets.DISTRIBUTION_CERTIFICATE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          keychain_password=$(openssl rand -hex 32)
          security create-keychain -p "$keychain_password" "$RUNNER_TEMP/signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/signing.keychain-db"
          security unlock-keychain -p "$keychain_password" "$RUNNER_TEMP/signing.keychain-db"
          security import "$RUNNER_TEMP/signing.p12" -k "$RUNNER_TEMP/signing.keychain-db" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$RUNNER_TEMP/signing.keychain-db" >/dev/null
          security list-keychains -d user -s "$RUNNER_TEMP/signing.keychain-db"
          python3 - <<'PYCODE'
          import os
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.serialization import pkcs12
          from cryptography.x509.oid import NameOID
          with open(os.environ['RUNNER_TEMP'] + '/signing.p12', 'rb') as f:
              _, cert, _ = pkcs12.load_key_and_certificates(f.read(), os.environ['P12_PASSWORD'].encode())
          team = cert.subject.get_attributes_for_oid(NameOID.ORGANIZATIONAL_UNIT_NAME)[0].value
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('TEAM_ID=' + team + '\nSIGNING_IDENTITY=' + cert.fingerprint(hashes.SHA1()).hex().upper() + '\n')
          PYCODE
          python scripts/ci/install_profile.py
      - name: Archive with manual signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive -project FurnacePath.xcodeproj -scheme FurnacePath \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FurnacePath.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            MARKETING_VERSION=1.0 CURRENT_PROJECT_VERSION="2000.${GITHUB_RUN_NUMBER}"
      - name: Export IPA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib
          with open(os.environ['RUNNER_TEMP'] + '/ExportOptions.plist', 'wb') as f:
              plistlib.dump({'method': 'app-store-connect', 'signingStyle': 'manual', 'signingCertificate': os.environ['SIGNING_IDENTITY'],
                            'provisioningProfiles': {'com.jackdewan.furnacepath': os.environ['PROFILE_UUID']},
                            'teamID': os.environ['TEAM_ID'], 'destination': 'export',
                            'manageAppVersionAndBuildNumber': False}, f)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/FurnacePath.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Inspect archive and IPA versions
        shell: bash
        run: |
          set -euo pipefail
          inspect_version() {
            echo "$1"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$2"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$2"
          }
          inspect_version 'Archive: CFBundleVersion, CFBundleShortVersionString' \
            "$RUNNER_TEMP/FurnacePath.xcarchive/Products/Applications/FurnacePath.app/Info.plist"
          unzip -q "$RUNNER_TEMP/ipa/FurnacePath.ipa" 'Payload/*.app/Info.plist' -d "$RUNNER_TEMP/ipa-version"
          inspect_version 'IPA: CFBundleVersion, CFBundleShortVersionString' \
            "$RUNNER_TEMP/ipa-version/Payload/FurnacePath.app/Info.plist"
      - name: Upload to TestFlight (create missing app and retry)
        shell: bash
        run: |
          set -euo pipefail
          upload() {
            xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/ipa/FurnacePath.ipa" \
              --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool-upload.log"
          }
          if ! upload; then
            if ! grep -Eiq 'Cannot determine the Apple ID from Bundle ID|No suitable application records were found|Could not find (an|the) app|No application record|app record.*(not found|does not exist)' "$RUNNER_TEMP/altool-upload.log"; then
              exit 1
            fi
            ruby scripts/ci/create_app.rb
            upload
          fi
          grep -Eiq 'UPLOAD SUCCEEDED|No errors uploading|successfully uploaded' "$RUNNER_TEMP/altool-upload.log"
          echo 'altool confirmed successful TestFlight delivery.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf "$RUNNER_TEMP/asc-private" "$RUNNER_TEMP/signing.p12"
