name: TestFlight delivery
on:
  workflow_dispatch:
    inputs:
      team_id:
        description: Apple Developer Team ID (optional if discoverable from existing certificates)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: testflight-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ inputs.team_id || vars.APPLE_TEAM_ID }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Prepare private API key and signing team
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_dir="$RUNNER_TEMP/asc-private"
          mkdir -p "$key_dir"
          export API_PRIVATE_KEYS_DIR="$key_dir"
          export ASC_KEY_PATH="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          python3 - <<'PY'
          import base64, os
          try:
              raw = base64.b64decode(os.environ['ASC_KEY_P8_BASE64'], validate=True)
              with open(os.environ['ASC_KEY_PATH'], 'wb') as key:
                  key.write(raw)
          except Exception:
              raise SystemExit('Cannot decode App Store Connect key; verify the secret format.') from None
          PY
          unset ASC_KEY_P8_BASE64
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"
          echo "API_PRIVATE_KEYS_DIR=$API_PRIVATE_KEYS_DIR" >> "$GITHUB_ENV"
          ruby scripts/ci/signing_team.rb
      - name: Archive with automatic signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive -project FurnacePath.xcodeproj -scheme FurnacePath \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FurnacePath.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION=1.0 CURRENT_PROJECT_VERSION="2000.${GITHUB_RUN_NUMBER}"
      - name: Export IPA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib
          with open(os.environ['RUNNER_TEMP'] + '/ExportOptions.plist', 'wb') as f:
              plistlib.dump({'method': 'app-store-connect', 'signingStyle': 'automatic',
                            'teamID': os.environ['TEAM_ID'], 'destination': 'export',
                            'manageAppVersionAndBuildNumber': False}, f)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/FurnacePath.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Upload to TestFlight (create missing app and retry)
        shell: bash
        run: |
          set -euo pipefail
          upload() {
            xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/ipa/FurnacePath.ipa" \
              --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool-upload.log"
          }
          if ! upload; then
            if ! grep -Eiq 'Cannot determine the Apple ID from Bundle ID|No suitable application records were found|Could not find (an|the) app|No application record|app record.*(not found|does not exist)' "$RUNNER_TEMP/altool-upload.log"; then
              exit 1
            fi
            ruby scripts/ci/create_app.rb
            upload
          fi
          grep -Eiq 'UPLOAD SUCCEEDED|No errors uploading|successfully uploaded' "$RUNNER_TEMP/altool-upload.log"
          echo 'altool confirmed successful TestFlight delivery.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private signing material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/asc-private"
