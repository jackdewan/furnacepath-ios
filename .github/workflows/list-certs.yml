name: List ASC certificates

on:
  workflow_dispatch:

jobs:
  list-certs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install PyJWT cryptography requests

      - name: Write App Store Connect key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: List certificates
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
        run: python scripts/ci/list_certs.py

      - name: Upload certificate list
        uses: actions/upload-artifact@v4
        with:
          name: asc-certificates
          path: |
            certs.txt
            certs_raw.json
          if-no-files-found: error

      - name: Remove key material
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
