name: FurnacePath
options:
  bundleIdPrefix: com.jackdewan
  deploymentTarget:
    iOS: '17.0'
targets:
  FurnacePathUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FurnacePathUITests]
    dependencies:
      - target: FurnacePath
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jackdewan.furnacepath.uitests
  FurnacePath:
    type: application
    platform: iOS
    sources: [FurnacePath]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackdewan.furnacepath
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: 14
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: FurnacePath/FurnacePath.entitlements
    info:
      path: FurnacePath/Info.plist
      properties:
        CFBundleDisplayName: FurnacePath
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleIconName: AppIcon
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSExceptionDomains:
            '100.87.179.24':
              NSExceptionAllowsInsecureHTTPLoads: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
schemes:
  FurnacePath:
    build:
      targets:
        FurnacePath: all
        FurnacePathUITests: [test]
    test:
      targets: [FurnacePathUITests]
